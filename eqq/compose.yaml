name: eqq

services:
  dev:
    build:
      context: .
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/workspace/eqq
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  redis_data:
